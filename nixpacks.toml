# nixpacks.toml — WEB-01 Phase 4 cutover (decision D-6: stay on Nixpacks).
#
# Railway still builds with the Python provider (requirements.txt), exactly as before.
# This file only ADDS a Node 22 runtime and a build phase for the Next.js UI in web/.
# railway.toml is unchanged: same builder, same `sh startup.sh`, same /health check.
#
# If this build phase fails, Railway keeps the previous deploy running. If it is ever
# skipped, startup.sh finds no web/.next/standalone/server.js and serves the classic
# Dash UI on $PORT instead — so the API never depends on the web build succeeding.
#
# Rollback: delete this file IN GITHUB (a re-upload cannot remove it, CLAUDE.md §5.0),
# or just set Railway Variable SEMI_UI=classic.

[phases.setup]
nixPkgs = ["...", "nodejs_22"]

[phases.build]
cmds = [
  # 1. Regenerate the UI's catalogue from products_config.py and fail on ticker drift.
  "python export_web_config.py",
  # 2. Install exactly the lockfile and build the standalone server.
  "cd web && npm ci && npm run build",
  # 3. Standalone output does not include static assets; Next documents this copy.
  "cp -r web/.next/static web/.next/standalone/.next/static",
]
